@let LG = responsive.isLg();
@let XL = responsive.isXl();

@let titleSizes = [ "home__title-desktop-size", "home__title-mobile-size" ];
@let titleSize = (XL || LG) ? titleSizes[0] : titleSizes[1];

<section [ngClass]="'home'">
  <h1 [ngClass]="'home__title ' + titleSize">
    {{ "features.header.title-home" | transloco}} <span>Ryan Soares</span>

  </h1>

  <p [ngClass]="'home__text'">{{ "features.header.p-home" | transloco }}</p>

</section>

<app-code-box [boxName]="'home'"></app-code-box>
