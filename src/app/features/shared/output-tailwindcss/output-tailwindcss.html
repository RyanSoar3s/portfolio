<div class="terminal">
  <div class="terminal-bar">
    <span class="dot red"></span>
    <span class="dot yellow"></span>
    <span class="dot green"></span>

  </div>

  <div class="terminal-body">
    <div class="line">
      <span class="prompt">$</span>

      <span
        class="typing"
        style="
            --chars:20ch;
            --steps:20;
            --delay:300ms;
            --duration:1200ms;
        ">
        echo 'hello, world'

      </span>

    </div>

      <div class="line output">
        <span
          class="fade"
          style="--delay:1600ms;">
          hello, world

        </span>

      </div>

  </div>

</div>
